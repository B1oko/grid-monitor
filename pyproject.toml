[project]
name = "grid-monitor"
version = "0.3.0"
description = "Self-hosted live dashboard for solar inverters."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.14.0",
    "asyncpg>=0.31.0",
    "fastapi==0.141.1",
    "pydantic-settings==2.15.0",
    "pymodbus==3.16.1",
    "pywebpush>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "tzdata>=2026.4",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
